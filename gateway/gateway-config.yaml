# SGLang Model Gateway configuration reference.
# This is documentation for our project; the gateway does not
# automatically load this YAML file. The Nomad job passes
# supported settings through command-line arguments.

gateway:
  name: "sglang-model-gateway"
  host: "0.0.0.0"
  port: 30000
  policy: "cache_aware"
  max_concurrent_requests: 64

worker:
  service_name: "sglang-worker"
  port: 8000
  health_path: "/health"

discovery:
  provider: "consul"
  method: "to_be_configured"
  note: "Worker discovery will be configured and tested when the Nomad environment is available."

testing:
  gpu_inference: "pending_gpu_access"
  chat_completion: "pending_gpu_access"