# Project reference settings for SGLang Model Gateway.
# This file is documentation for our project, not a native gateway config.
# The Nomad job will pass supported settings to the gateway CLI.

gateway:
  name: sglang-model-gateway
  host: "0.0.0.0"
  port: 30000
  policy: "cache_aware"

# Example worker addresses only.
# Replace these with real worker addresses when the cluster is available.
workers:
  - name: sglang-worker-1
    url: "http://127.0.0.1:8000"
  - name: sglang-worker-2
    url: "http://127.0.0.1:8001"

discovery:
  provider: "consul"
  integration: "to-be-implemented"
  description: "Worker addresses will be obtained from Consul or managed through the gateway API."